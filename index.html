<title>Elorrioko Tabloia</title>
<style>
  /* La tipografía se sirve desde el propio repositorio: una web del pueblo no debería
     mandar la IP de cada vecino a un tercero ni dejar de verse bien el día que ese
     tercero falle. Inter es una fuente variable, así que los cuatro pesos que usamos
     salen de un único fichero de 48 KB. */
  @font-face {
    font-family:'Inter'; font-style:normal; font-weight:300 600; font-display:swap;
    src:url('fuentes/inter-latin.woff2') format('woff2');
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,
      U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
  }

  /* ==========================================================================
     TOKENS
     Tres estados de tema: claro (bare :root), oscuro del sistema, y oscuro
     elegido a mano. Todo color sale de aquí; nada de literales sueltos.
     ========================================================================== */
  :root {
    /* espaciado: una sola escala de 4 px */
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
    --s7:48px; --s8:64px; --s9:96px;
    --sec:clamp(40px,5vw,72px);          /* aire entre bloques de página */
    --gut:clamp(20px,3.4vw,64px);
    --wrap-max:2160px;

    /* tipografía: siete pasos */
    --t-label:11px;                      /* rótulos en versal, claves de dato */
    --t-meta:13px;                       /* metadatos, notas, pie */
    --t-ui:14px;                         /* navegación, filtros, botones */
    --t-body:16px;                       /* texto corrido y título de tarjeta */
    --t-h3:20px;
    --t-h2:clamp(22px,2.2vw,28px);
    --t-h1:clamp(28px,3.4vw,44px);
    --t-display:clamp(28px,3.8vw,50px);  /* sólo la portada */

    --ground:#ffffff; --ground-warm:#f6f3ed; --ink:#111111; --body:#3f3f3f;
    --mute:#6f6c66; --hair:#e7e3dc; --hair-soft:#f1ede6; --line:#94908a;
    --accent:#14453d; --accent-dim:#5c7a70; --accent-soft:#eaf0ed;
    --star:#14453d; --alerta:#a53a31;
    --r:10px; --r-s:5px;
    --sh:0 1px 2px rgba(20,30,25,.05), 0 10px 30px -12px rgba(20,30,25,.18);
    --sh-hi:0 2px 6px rgba(20,30,25,.07), 0 18px 40px -14px rgba(20,30,25,.28);
    --scrim:linear-gradient(to top, rgba(8,14,11,.78) 0%, rgba(8,14,11,.42) 45%, rgba(8,14,11,.12) 85%),
      linear-gradient(to right, rgba(8,14,11,.58) 0%, rgba(8,14,11,.24) 48%, rgba(8,14,11,0) 74%);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:#141714; --ground-warm:#1c201c; --ink:#f2efe9; --body:#b0aca4;
      --mute:#9a968d; --hair:#2c312c; --hair-soft:#232823; --line:#606460;
      --accent:#8fc0b0; --accent-dim:#6d9184; --accent-soft:#1e2723; --star:#8fc0b0;
      --alerta:#e0736a;
      --sh:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -12px rgba(0,0,0,.6);
      --sh-hi:0 2px 6px rgba(0,0,0,.5), 0 18px 40px -14px rgba(0,0,0,.75);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ground:#141714; --ground-warm:#1c201c; --ink:#f2efe9; --body:#b0aca4;
    --mute:#9a968d; --hair:#2c312c; --hair-soft:#232823; --line:#606460;
    --accent:#8fc0b0; --accent-dim:#6d9184; --accent-soft:#1e2723; --star:#8fc0b0;
    --alerta:#e0736a;
    --sh:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -12px rgba(0,0,0,.6);
    --sh-hi:0 2px 6px rgba(0,0,0,.5), 0 18px 40px -14px rgba(0,0,0,.75);
    color-scheme: dark;
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  img { display:block; max-width:100%; }

  body { font-family:'Inter',-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;
    font-weight:300; font-size:var(--t-ui); background:var(--ground); color:var(--body);
    line-height:1.65; -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums; }

  .wrap { max-width:var(--wrap-max); margin:0 auto;
    padding-left:max(var(--gut), env(safe-area-inset-left));
    padding-right:max(var(--gut), env(safe-area-inset-right)); }
  .wrap.view { max-width:1180px; }
  .wrap.narrow { max-width:820px; }
  .stack { display:flex; flex-direction:column; }
  .g6{gap:6px} .g10{gap:10px} .g14{gap:14px} .g20{gap:20px} .g28{gap:28px}
  .g40{gap:40px} .g56{gap:56px} .g72{gap:72px}

  /* ---------- cabecera ---------- */
  .demo-strip { background:var(--accent); color:#f3f7f5; }
  .demo-strip .wrap { padding-block:9px; font-size:12px; display:flex; gap:6px 14px; flex-wrap:wrap;
    align-items:baseline; justify-content:center; text-align:center; }
  .demo-strip b { font-weight:600; letter-spacing:.12em; text-transform:uppercase; font-size:10px; }
  :root[data-theme="dark"] .demo-strip { background:var(--accent-soft); color:var(--ink); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .demo-strip { background:var(--accent-soft); color:var(--ink); }
  }

  .bar { position:sticky; top:0; z-index:40; background:var(--ground);
    border-bottom:1px solid var(--hair); }
  .bar .wrap { display:flex; align-items:center; gap:12px 40px; padding-block:18px; flex-wrap:wrap; }
  .mark { background:none; border:none; padding:0; cursor:pointer; display:flex; align-items:baseline;
    gap:9px; flex:0 0 auto; }
  .mark .w { font-size:20px; font-weight:500; letter-spacing:-.035em; color:var(--accent); }
  .mark .s { font-size:9.5px; font-weight:500; letter-spacing:.18em; text-transform:uppercase; color:var(--mute); }

  /* secciones = ámbitos, como los departamentos de una tienda */
  .secs { display:flex; gap:30px; flex:1 1 0; min-width:0; overflow-x:auto; scrollbar-width:none; }
  .secs-movil { display:none; }
  .secs::-webkit-scrollbar { display:none; }
  .secs button { background:none; border:none; border-bottom:1.5px solid transparent; cursor:pointer;
    font:inherit; font-size:var(--t-ui); font-weight:400; color:var(--body); padding:2px 0 3px;
    white-space:nowrap; transition:color .15s, border-color .15s; }
  .secs button:hover { color:var(--ink); }
  .secs button[aria-pressed="true"] { color:var(--ink); border-bottom-color:var(--ink); }

  .barright { display:flex; align-items:center; gap:10px 22px; flex:0 0 auto; margin-left:auto; }
  .ibtn { background:none; border:none; padding:0; cursor:pointer; color:var(--ink);
    display:grid; place-items:center; width:44px; height:44px; margin:-13px;
    transition:opacity .15s; }
  .ibtn:hover { opacity:.6; }
  .ibtn svg { width:20px; height:20px; display:block; }
  .nav { display:flex; gap:22px; }
  .nav button { background:none; border:none; border-bottom:1.5px solid transparent; cursor:pointer;
    font:inherit; font-size:var(--t-ui); font-weight:400; color:var(--body); padding:6px 0;
    transition:color .15s, border-color .15s; }
  .nav button:hover { color:var(--ink); }
  .nav button[aria-current="page"] { color:var(--ink); border-bottom-color:var(--ink); }
  .nav button .c { color:var(--mute); }
  .nav button svg { display:none; }
  .langs { display:flex; align-items:center; gap:0; }
  .langs .sl { color:var(--line); font-size:12px; padding:0 2px; }
  .langs button { background:none; border:none; cursor:pointer; font:inherit; font-size:13px;
    font-weight:400; letter-spacing:.06em; color:var(--mute); padding:12px 9px; margin-block:-12px;
    transition:color .15s; }
  .langs button:hover { color:var(--body); }
  .langs button[aria-pressed="true"] { color:var(--ink); font-weight:500; }
  .btn-pub { border:none; background:var(--accent); color:var(--ground); border-radius:999px;
    padding:11px 22px; font:inherit; font-size:var(--t-ui); font-weight:500; letter-spacing:-.005em;
    cursor:pointer; white-space:nowrap; transition:opacity .15s; }
  .btn-pub:hover { opacity:.85; }

  /* ---------- capa de búsqueda, se abre desde la lupa ---------- */
  .searchlayer { border-top:1px solid var(--hair); background:var(--ground); }
  .searchlayer .wrap { display:flex; align-items:center; gap:20px; padding-block:20px; }
  .qbox { position:relative; flex:1 1 auto; min-width:0; }
  .searchlayer input[type=text] { width:100%; border:none; background:none; padding:0; border-radius:0;
    font:inherit; font-size:clamp(19px,2.1vw,26px); font-weight:300; letter-spacing:-.022em; color:var(--ink); }
  .searchlayer input[type=text]:focus { outline:none; }
  .searchlayer input::placeholder { color:var(--mute); }
  .searchlayer .qbox .sugp { left:0; right:auto; width:min(620px,100%); top:calc(100% + 18px); }

  /* ---------- barra de filtros ---------- */
  .filterbar { position:sticky; top:var(--barh,58px); z-index:30; background:var(--ground);
    border-bottom:1px solid var(--hair); }
  .filterbar .wrap { display:flex; align-items:center; gap:8px 28px; padding-block:14px; flex-wrap:wrap; }
  .filterbar .flabel { font-size:var(--t-label); font-weight:500; letter-spacing:.16em;
    text-transform:uppercase; color:var(--mute); }
  .fgroup { display:flex; gap:24px; flex-wrap:wrap; align-items:center; }
  .fdrop { position:relative; }
  .fbtn { border:none; border-bottom:1.5px solid transparent; padding:8px 0; background:none;
    font:inherit; font-size:var(--t-ui); color:var(--body); cursor:pointer; white-space:nowrap;
    display:flex; gap:6px; align-items:center; transition:color .15s, border-color .15s; }
  .fbtn:hover { color:var(--ink); }
  .fbtn .ar { font-size:7px; opacity:.5; }
  .fbtn.act, .fdrop.on .fbtn { color:var(--ink); border-bottom-color:var(--ink); }
  .fbtn.act .ar, .fdrop.on .fbtn .ar { opacity:.7; }
  .qchip { display:flex; align-items:center; gap:8px; border:none; background:var(--accent-soft);
    color:var(--accent); border-radius:999px; padding:7px 14px; font:inherit; font-size:var(--t-meta);
    cursor:pointer; }
  .qchip b { font-weight:500; }
  .qchip span { font-size:14px; opacity:.75; }
  .fpanel { position:absolute; top:calc(100% + 10px); left:0; z-index:50; background:var(--ground);
    border:1px solid var(--hair); border-radius:var(--r); box-shadow:var(--sh-hi); padding:7px;
    min-width:216px; display:none; max-height:340px; overflow-y:auto; }
  .fdrop.on .fpanel { display:block; }
  .fopt { display:block; width:100%; text-align:left; background:none; border:none; padding:10px 12px;
    border-radius:var(--r-s); font:inherit; font-size:var(--t-ui); color:var(--body); cursor:pointer; }
  .fopt:hover { background:var(--ground-warm); color:var(--ink); }
  .fopt[aria-pressed="true"] { color:var(--accent); font-weight:500; }
  .fopt .n { float:right; color:var(--mute); font-size:12px; font-weight:300; }
  .fhead { font-size:var(--t-label); font-weight:500; letter-spacing:.13em; text-transform:uppercase;
    color:var(--mute); padding:12px 12px 5px; }
  .sugp { position:absolute; top:calc(100% + 10px); left:0; width:min(430px, 74vw); background:var(--ground);
    border:1px solid var(--hair); border-radius:var(--r); box-shadow:var(--sh-hi); padding:7px; z-index:60;
    display:none; max-height:350px; overflow-y:auto; }
  .qbox .sugp { width:min(380px, 80vw); }
  .sugp.on { display:block; }
  .sug { display:flex; gap:11px; align-items:center; width:100%; text-align:left; background:none; border:none;
    padding:9px 11px; border-radius:var(--r-s); cursor:pointer; font:inherit; }
  .sug:hover, .sug.sel { background:var(--ground-warm); }
  .sug img { width:42px; height:34px; object-fit:cover; border-radius:4px; flex:none; }
  .sug .dot { width:34px; height:34px; border-radius:6px; background:var(--accent-soft); color:var(--accent);
    display:grid; place-items:center; font-size:13px; flex:none; }
  .sug .t { font-size:var(--t-ui); color:var(--ink); line-height:1.3; }
  .sug .s { font-size:var(--t-meta); color:var(--mute); }
  .fmeta { margin-left:auto; display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    font-size:var(--t-meta); color:var(--mute); }
  .fmeta b { color:var(--ink); font-weight:500; }
  .sel { border:none; background:none; font:inherit; font-size:var(--t-meta); color:var(--ink);
    cursor:pointer; border-bottom:1px solid var(--line); padding:6px 0; border-radius:0; }
  .lnk { background:none; border:none; padding:6px 0; cursor:pointer; font:inherit; font-size:var(--t-meta);
    color:var(--accent); text-decoration:underline; text-underline-offset:3px; }
  .btn-filtros { display:none; }
  .btn-filtros.act { color:var(--accent); font-weight:600; }
  .busq-movil { display:none; }
  .saltar { position:absolute; left:-9999px; top:0; z-index:120; background:var(--accent);
    color:var(--ground); padding:12px 20px; font-size:var(--t-ui); text-decoration:none;
    border-radius:0 0 var(--r-s) 0; }
  .saltar:focus { left:0; }

  /* ---------- portada: banda de entrada ---------- */
  .hero { position:relative; display:flex; align-items:flex-end; overflow:hidden;
    min-height:clamp(190px,21vw,288px); background:var(--ground-warm); }
  .hero > img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:50% 62%; }
  .hero::after { content:''; position:absolute; inset:0; background:var(--scrim); }
  .hero .wrap { position:relative; z-index:1; width:100%; padding-block:var(--s6) var(--s7); }
  .hero .in { display:flex; flex-direction:column; gap:var(--s3); max-width:min(660px,52%); }
  .hero .kick { font-size:var(--t-label); font-weight:500; letter-spacing:.2em; text-transform:uppercase;
    color:rgba(255,255,255,.78); }
  .hero h1 { font-size:var(--t-display); font-weight:300; letter-spacing:-.035em; line-height:1.05;
    color:#fff; text-wrap:balance; }
  .hero p { font-size:var(--t-body); line-height:1.5; color:rgba(255,255,255,.88); max-width:40ch; }

  /* ---------- la pregunta de la edad ---------- */
  .edades { padding-block:var(--s6) 0; }
  .edades + .plazos { margin-top:var(--s6); }
  .edades .in { display:flex; align-items:baseline; gap:var(--s3) var(--s6); flex-wrap:wrap; }
  .edades .q { font-size:var(--t-body); color:var(--ink); font-weight:400; }
  .edades .ops { display:flex; gap:var(--s5); flex-wrap:wrap; align-items:baseline; }
  .edades .ops { gap:var(--s2); }
  .edades button { background:none; border:1px solid var(--hair); border-radius:999px; cursor:pointer;
    font:inherit; font-size:var(--t-ui); color:var(--body); padding:9px 17px; white-space:nowrap;
    transition:border-color .15s, color .15s, background-color .15s; }
  .edades button:hover { border-color:var(--mute); color:var(--ink); }
  .edades button[aria-pressed="true"] { background:var(--accent); border-color:var(--accent);
    color:var(--ground); font-weight:500; }
  .edades .lnk { border:none; padding:9px 4px; }

  /* ---------- materias ---------- */
  .catwrap { padding-block:var(--sec) 0; }
  .cats { display:grid; grid-template-columns:repeat(var(--ncats,9),minmax(0,1fr)); gap:var(--s4);
    margin-top:var(--s5); }
  .cats.pocas { display:flex; gap:var(--s4); flex-wrap:wrap; }
  .cats.pocas .cat-tile { flex:0 0 clamp(140px,15vw,196px); }
  .cat-tile { display:flex; flex-direction:column; gap:10px; background:none; border:none; padding:0;
    text-align:left; cursor:pointer; }
  .cat-ph { position:relative; aspect-ratio:1/1; border-radius:var(--r); overflow:hidden;
    background:var(--ground-warm); }
  .cat-tile img { width:100%; height:100%; object-fit:cover; transition:transform .5s ease; }
  .cat-tile:hover img { transform:scale(1.06); }
  .cat-tile .lbl { display:flex; flex-direction:column; color:var(--ink); font-size:var(--t-ui);
    font-weight:400; line-height:1.25; }
  .cat-tile .lbl .nm { min-height:calc(1.25em * 2); }
  .cat-tile .lbl .n { margin-top:auto; font-size:var(--t-meta); color:var(--mute); font-weight:300; }
  .cat-tile[aria-pressed="true"] .cat-ph { box-shadow:0 0 0 2px var(--accent), 0 0 0 5px var(--ground); }
  .cat-tile[aria-pressed="true"] .lbl .nm { font-weight:500; }

  /* ---------- resultados ---------- */
  .reswrap { padding-block:var(--sec) var(--s9); }
  .resmeta { display:flex; align-items:baseline; justify-content:space-between; gap:var(--s3) var(--s5);
    flex-wrap:wrap; }
  .fmeta-ord { display:flex; align-items:center; gap:8px; }
  .vh { position:absolute; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden;
    clip-path:inset(50%); white-space:nowrap; border:0; }
  .grupo { display:flex; flex-direction:column; gap:var(--s5); }
  .grupo-h { display:flex; align-items:baseline; justify-content:space-between; gap:var(--s4);
    flex-wrap:wrap; border-top:1px solid var(--hair); padding-top:var(--s4); }
  .grupo-h h2 { font-size:var(--t-h3); font-weight:500; color:var(--ink); letter-spacing:-.018em; }
  .grupo-h .n { font-size:var(--t-meta); color:var(--mute); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));
    gap:var(--s7) var(--s5); }
  @media (min-width:1900px) { .grid { grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); } }
  .grid.rel { grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr)); }

  /* ---------- tarjeta ---------- */
  .card { position:relative; display:flex; flex-direction:column; gap:var(--s3); }
  .ph { position:relative; aspect-ratio:4/3; border-radius:var(--r); overflow:hidden; background:var(--ground-warm); }
  .ph img { width:100%; height:100%; object-fit:cover; transition:transform .55s ease; }
  .card:hover .ph img { transform:scale(1.045); }
  .card-body { display:flex; flex-direction:column; gap:3px; }
  .card-k { font-size:var(--t-label); font-weight:500; letter-spacing:.12em; text-transform:uppercase;
    color:var(--mute); }
  .card-t { font-size:var(--t-body); font-weight:500; color:var(--ink); line-height:1.28;
    letter-spacing:-.012em; margin-top:1px; }
  .card-t a { color:inherit; text-decoration:none; display:-webkit-box; -webkit-line-clamp:2;
    -webkit-box-orient:vertical; overflow:hidden; }
  /* el enlace del título cubre la tarjeta entera; el corazón queda por encima */
  .card-t a::after { content:''; position:absolute; inset:0; border-radius:var(--r); }
  .card:hover .card-t a { text-decoration:underline; text-underline-offset:3px; }
  .card-s { font-size:var(--t-meta); color:var(--mute); white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis; }
  .card-foot { display:flex; align-items:baseline; justify-content:space-between; gap:var(--s3);
    margin-top:var(--s2); }
  .card-p { font-size:15px; color:var(--ink); }
  .card-p b { font-weight:500; }
  .card-p .u { font-size:var(--t-meta); color:var(--mute); font-weight:300; }
  .stars { display:flex; align-items:center; gap:4px; font-size:var(--t-meta); color:var(--ink);
    white-space:nowrap; }
  .stars i { font-style:normal; color:var(--star); }
  .stars em { font-style:normal; color:var(--mute); font-weight:300; }
  .ademas { display:flex; flex-direction:column; gap:var(--s3); }
  .ademas ul { list-style:none; display:flex; flex-direction:column; gap:6px; }
  .ademas li { font-size:var(--t-meta); color:var(--body); }

  /* ---------- agenda ---------- */

  /* ---------- formularios ---------- */

  /* ---------- varios ---------- */

    color:var(--ink); text-wrap:balance; }

  .toast { position:fixed; left:50%; bottom:26px; transform:translateX(-50%); z-index:70; background:var(--ink);

  footer.foot { border-top:1px solid var(--hair); background:var(--ground-warm); }

  /* ---------- entrada ---------- */
  .splash { position:fixed; inset:0; z-index:100; background:#14453d; display:grid; place-items:center;
    transition:transform .52s cubic-bezier(.76,0,.24,1), opacity .38s ease .1s; }
  .splash.off { transform:translateY(-101%); opacity:0; pointer-events:none; }
  .sp-in { text-align:center; padding:24px; }

  /* Área táctil de 44 px sin desplazar nada: el pseudoelemento sobresale, el dibujo no. */

  @media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }

  /* ---------- adaptaciones ---------- */
  @media (max-width:1400px) {
    .secs { order:3; flex:1 0 100%; margin-inline:calc(-1 * var(--gut)); padding-inline:var(--gut); }

/* Una agenda que dice «pronto» de algo que ya pasó es lo único que una agenda no
   puede hacer: se calcula contra la fecha de hoy, no se escribe a mano. */
const MESNUM = { Septiembre:8, Octubre:9, Noviembre:10, Diciembre:11 };
function diasHasta(a){
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const d = new Date(hoy.getFullYear(), MESNUM[a.mes.es], +a.dia);
  if(d < hoy) d.setFullYear(hoy.getFullYear() + 1);
  return Math.round((d - hoy) / 86400000);
}
AGENDA.forEach(a => { a.soon = diasHasta(a) <= 21; });
AGENDA.sort((a,b) => diasHasta(a) - diasHasta(b));

/* ---------- filtrado ---------- */
/* El texto sobre el que se busca no cambia durante la sesión: se calcula una vez por
   ficha. Sin esto, teclear una letra reconstruía la misma cadena decenas de veces. */
/* En un pueblo bilingüe, quien busca «natación» tiene que encontrar «igeriketa».
   Al texto de cada ficha se le añade la otra mitad del par. */
const SINONIMOS = [
  ['natacion','igeriketa'], ['futbol','futbola'], ['baloncesto','saskibaloia'],
  ['pelota','pilota'], ['ajedrez','xakea'], ['musica','musika'], ['baile','dantza'],
  ['danza','dantza'], ['ingles','ingelesa'], ['frances','frantsesa'], ['aleman','alemana'],
  ['euskera','euskara'], ['piano','pianoa'], ['guitarra','gitarra'], ['bateria','bateria'],
  ['montana','mendia'], ['atletismo','atletismoa'], ['ciclismo','txirrindularitza'],
  ['gimnasia','gimnasia'], ['teatro','antzerkia'], ['dibujo','marrazketa'],
  ['ceramica','zeramika'], ['informatica','informatika'], ['robotica','robotika'],
  ['matematicas','matematika'], ['fisica','fisika'], ['quimica','kimika'],
  ['deberes','etxeko lanak'], ['verano','uda'], ['campamento','udalekuak'],
  ['ludoteca','ludoteka'], ['bertso','bertsolaritza'], ['coro','abesbatza'],
  ['carne','karneta'], ['conducir','gidatzeko'], ['mayores','nagusiak'],
  ['adultos','helduak'], ['ninos','haurrak'], ['gratis','doan'], ['idiomas','hizkuntzak']
];
function heno(f){
  if(f._heno === undefined){
    const c  = CATS.find(x => x.id === f.cat)   || { es:'', eu:'' };
    const ti = TIPOS.find(x => x.id === f.tipo) || { es:'', eu:'' };
    let h = norm([f.titulo, f.proveedor, (f.materias||[]).join(' '),
      c.es, c.eu, ti.es, ti.eu, f.desc, f.lugar].join(' '));
    SINONIMOS.forEach(([a,b]) => {
      if(h.indexOf(a) >= 0 && h.indexOf(b) < 0) h += ' ' + b;
      else if(h.indexOf(b) >= 0 && h.indexOf(a) < 0) h += ' ' + a;
    });
    f._heno = h;
  }
  return f._heno;
}
function filtrar(lista, saltar){
  const s = saltar || {};
  const term = norm(state.q).trim().split(/\s+/).filter(Boolean);
  /* Los .find() se resuelven fuera del bucle. Si un id no existe (un dato mal escrito
     a mano dentro de dos años) el filtro se ignora, no se cae la búsqueda entera. */
  const amb = (!s.ambito && state.ambito) ? AMBITOS.find(x => x.id === state.ambito) : null;
  const ed  = (!s.edad   && state.edad)   ? EDADES.find(e => e.id === state.edad)    : null;
  const cat = s.cat ? null : state.cat, tipo = s.tipo ? null : state.tipo;
  const mod = s.mod ? null : state.mod, dia = s.dia ? null : state.dia;
  const pmax = s.precioMax ? null : state.precioMax;
  const idi = s.idioma ? null : state.idioma;
  const pl = s.plaza ? null : state.plaza;
  const buscar = s.q ? [] : term;
  return lista.filter(f => {
    if(amb && amb.cats.indexOf(f.cat) < 0) return false;
    if(cat  && f.cat  !== cat)  return false;
    if(tipo && f.tipo !== tipo) return false;
    if(mod  && f.mod.indexOf(mod) < 0) return false;
    if(dia  && f.dias.indexOf(dia) < 0) return false;
    if(pmax !== null && pmax !== undefined){
      if(pmax === 0){ if(f.precio !== 0) return false; }
      else if(precioMes(f) > pmax) return false;
    }
    if(idi && (f.idiomaClase || []).indexOf(idi) < 0) return false;
    if(pl && f.estado !== 'libre' && f.estado !== 'continua') return false;
    if(ed && !(f.edad[0] <= ed.max && f.edad[1] >= ed.min)) return false;
    if(buscar.length){ const h = heno(f); return buscar.every(x => h.indexOf(x) >= 0); }
    return true;
  });
}
function ordenar(l){
  l = l.slice();
  if(state.orden === 'precio') return l.sort((a,b) => precioMes(a) - precioMes(b));
  if(state.orden === 'edad')   return l.sort((a,b) => a.edad[0] - b.edad[0]);
  /* Las fichas sin valoración van al final, no al principio con un cero. */
  if(state.orden === 'valor')  return l.sort((a,b) => {
    const ra = rating(a), rb = rating(b);
    if(ra === null && rb === null) return 0;
    if(ra === null) return 1;
    if(rb === null) return -1;
    return rb - ra;
  });
  return l.sort((a,b) => {
    const d = CATS.findIndex(c=>c.id===a.cat) - CATS.findIndex(c=>c.id===b.cat);
    return d !== 0 ? d : a.proveedor.localeCompare(b.proveedor,'es');
  });
}
const hayFiltros = () => !!(state.q||state.ambito||state.cat||state.edad||state.tipo||state.mod||state.dia||state.idioma||state.plaza||state.precioMax!==null);

/* Los recuentos de cada opción se calculan de una vez, con un filtrado por dimensión
   (seis en total) en vez de uno por opción (cuarenta y dos). Para las materias se
   ignora también el ámbito: si no, «Idiomas» pone 0 estando en Deporte y al pulsarlo
   aparecen seis. */
let CONTEOS = null;
function calcularConteos(){
  const c = { cat:{}, edad:{}, tipo:{}, mod:{}, dia:{}, precioMax:{}, idioma:{}, plaza:{} };
  filtrar(state.fichas, { cat:1, ambito:1 }).forEach(f => { c.cat[f.cat] = (c.cat[f.cat]||0)+1; });
  filtrar(state.fichas, { edad:1 }).forEach(f => EDADES.forEach(e => {
    if(f.edad[0] <= e.max && f.edad[1] >= e.min) c.edad[e.id] = (c.edad[e.id]||0)+1; }));
  filtrar(state.fichas, { tipo:1 }).forEach(f => { c.tipo[f.tipo] = (c.tipo[f.tipo]||0)+1; });
  filtrar(state.fichas, { idioma:1 }).forEach(f => (f.idiomaClase||[]).forEach(i => { c.idioma[i] = (c.idioma[i]||0)+1; }));
  c.plaza['libre'] = filtrar(state.fichas, { plaza:1 }).filter(f => f.estado === 'libre' || f.estado === 'continua').length;
  filtrar(state.fichas, { mod:1 }).forEach(f => f.mod.forEach(m => { c.mod[m] = (c.mod[m]||0)+1; }));
  filtrar(state.fichas, { dia:1 }).forEach(f => f.dias.forEach(d => { c.dia[d] = (c.dia[d]||0)+1; }));
  const bp = filtrar(state.fichas, { precioMax:1 });
  c.precioMax['0']  = bp.filter(f => f.precio === 0).length;
  c.precioMax['20'] = bp.filter(f => precioMes(f) <= 20).length;
  c.precioMax['40'] = bp.filter(f => precioMes(f) <= 40).length;
  CONTEOS = c;
}
const contar = (k, v) => (CONTEOS && CONTEOS[k]) ? (CONTEOS[k][String(v)] || 0) : 0;
const contarCat = id => contar('cat', id);

const nAct = n => n + ' ' + (n === 1 ? t('actividad') : t('actividades'));
function sugerencias(q){
  const n = norm(q).trim(); if(!n) return [];
  const out = [];
  CATS.forEach(c => { if(norm(c[state.lang]).indexOf(n) >= 0)
    out.push({ k:'cat', v:c.id, t:c[state.lang], s:nAct(contarCat(c.id)), img:CAT_IMG[c.id] }); });
  const mats = {};
  state.fichas.forEach(f => f.materias.forEach(m => {
    if(norm(m).indexOf(n) >= 0){ const key = m.toLowerCase(); mats[key] = (mats[key]||0) + 1; } }));
  Object.keys(mats).sort((a,b) => mats[b]-mats[a]).slice(0,4).forEach(m =>
    out.push({ k:'mat', v:m, t:cap(m), s:nAct(mats[m]) }));
  state.fichas.filter(f => norm(f.titulo + ' ' + f.proveedor).indexOf(n) >= 0).slice(0,5).forEach(f =>
    out.push({ k:'ficha', v:f.id, t:f.titulo, s:f.proveedor + ' · ' + (f.precio===0?t('gratis'):f.precio+' €'+uni(f).s), img:IMG[f.id] }));
  return out.slice(0,9);
}

function busqAbierta(){ const l = $('#searchlayer'); return !!l && !l.hidden; }
function abrirBusq(){
  const l = $('#searchlayer'), b = $('#bar'); if(!l || !b) return;
  l.hidden = false; medirBarra();
  const i = $('#q'); if(!i) return;
  /* En el móvil la cabecera no está pegada arriba: si enfocamos sin más, el navegador
     sube la página de golpe y se pierde el sitio. Subimos a propósito. */
  if(getComputedStyle(b).position !== 'sticky') window.scrollTo(0,0);
  try { i.focus({ preventScroll:true }); } catch(e){ i.focus(); }
  i.select();
}

  const l = $('#searchlayer'); if(!l || l.hidden) return;

  document.documentElement.style.setProperty('--barh', b.offsetHeight + 'px');
}

const PARAMS = [['q','q'],['amb','ambito'],['cat','cat'],['edad','edad'],['tipo','tipo'],

const VISTAS_URL = ['agenda','guardados','publicar','admin'];
const rutaFicha = id => '#/ficha/' + id;
function rutaDe(){

  const q = [];
  if(state.view === 'buscar') PARAMS.forEach(([k,s]) => {
    const v = state[s];
    if(v === null || v === undefined || v === '') return;
    if(s === 'orden' && v === 'rel') return;
    q.push(k + '=' + encodeURIComponent(v));

     la URL igual que la tuya, y es leerURL() quien decide cuál de las dos manda. */

    const ids = (state.compartidos && state.compartidos.length) ? state.compartidos : state.guardados;

function limpiarFiltros(){

const VALIDO = {

  cat:      v => CATS.some(x => x.id === v),
  edad:     v => EDADES.some(x => x.id === v),
  tipo:     v => TIPOS.some(x => x.id === v),
  mod:      v => MODOS.some(x => x.id === v),
  dia:      v => DIAS.indexOf(v) >= 0,
  idioma:   v => IDIOMAS_CLASE.some(x => x.id === v),

  if(partes[0] === 'ficha' && +partes[1]){ state.fichaId = +partes[1]; state.view = 'ficha'; }
  else if(VISTAS_URL.indexOf(partes[0]) >= 0) state.view = partes[0];
  else state.view = 'buscar';

      if(v === null){ state[s] = (s === 'q') ? '' : null; return; }
      if(VALIDO[s] && !VALIDO[s](v)) return;      /* valor que no reconocemos: se ignora */
      state[s] = v;

    if(state.q === null) state.q = '';
    const l = u.get('lang');
    if(l === 'eu' || l === 'es') state.lang = l;
    /* una lista de guardados que alguien te ha pasado no pisa la tuya */
    if(state.view === 'guardados' && u.has('ids')){
      const ids = u.get('ids').split(',').map(Number).filter(n => n && state.fichas.some(f => f.id === n));
      const mios = state.guardados.slice().sort().join(',');

  if(v === 'publicar' && state.view !== 'publicar'){ state.enviada = null; state.paso = 1; }

document.addEventListener('keydown', e => {
  const el = e.target;
  if(el.id === 'q'){
    const p = $('#sug1');
    const items = p ? Array.prototype.slice.call(p.querySelectorAll('.sug')) : [];
    if(e.key === 'Escape'){ cerrarSug(); cerrarBusq(true); return; }
    if(!items.length || !p.classList.contains('on')){
      if(e.key === 'Enter'){ e.preventDefault(); cerrarBusq(false); aResultados(); }
      return;
    }
    if(e.key === 'ArrowDown'){ e.preventDefault(); state.sugIdx = Math.min(state.sugIdx + 1, items.length - 1); }
    else if(e.key === 'ArrowUp'){ e.preventDefault(); state.sugIdx = Math.max(state.sugIdx - 1, -1); }
    else if(e.key === 'Enter'){
      e.preventDefault();
      if(state.sugIdx >= 0) items[state.sugIdx].click(); else { cerrarSug(); cerrarBusq(false); aResultados(); }
      return;
    } else return;
    items.forEach((it,i) => { it.classList.toggle('sel', i === state.sugIdx);
      it.setAttribute('aria-selected', i === state.sugIdx); });
    marcarCombo(true, state.sugIdx);
    if(state.sugIdx >= 0) items[state.sugIdx].scrollIntoView({ block:'nearest' });
    return;
  }
  if(e.key === 'Escape'){
    if(document.querySelector('.fdrop.on')){
      const b = document.querySelector('.fdrop.on .fbtn');
      cerrarDrops(); if(b) b.focus(); return;
    }

const CAMPOS_REQ = { 1:['titulo','cat','desc','edadMin','edadMax'], 2:['precio','lugar','horario'],

function validarPaso(paso){
  const claves = CAMPOS_REQ[paso], nombres = t('rQue' + (paso === 1 ? '' : paso)), falta = [];
  claves.forEach((k,i) => { const v = state.form[k];
    if(v === undefined || v === null || v === '' || v === false) falta.push([k, nombres[i]]); });
  if(!falta.length) return true;
  let primero = null;
  falta.forEach(([k, nombre]) => {
    const el = document.getElementById(k);
    if(!el) return;
    el.setAttribute('aria-invalid','true');
    const c = el.closest('.field') || document.getElementById('campo-' + k);
    if(c){
      c.classList.add('err');
      if(!c.querySelector('.msg-err')){
        const m = document.createElement('span');
        m.className = 'msg-err'; m.textContent = t('arreglaCampo');
        c.appendChild(m);
      }
    }
    if(!primero) primero = el;
  });
  toast(t('tFalta') + falta.slice(0,2).map(f => f[1]).join(t('y')) + (falta.length > 2 ? t('tFaltaMas') : '.'));
  if(primero){
    primero.scrollIntoView({ block:'center', behavior:'smooth' });
    setTimeout(() => { try { primero.focus({ preventScroll:true }); } catch(e){ primero.focus(); } }, 220);
  }
  return false;
}

/* Compartir: con enlace real, ya no hace falta mentir con un aviso. */
function compartir(){
  const url = location.href;

  if(navigator.share){ navigator.share(datos).catch(() => {}); return; }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(() => toast(t('tCopiado')), () => toast(url));
    return;

}
function cambiarTema(){
  const n = temaActual() === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', n);
  try { localStorage.setItem('tablon.tema', n); } catch(e){}
  pintarBotonTema();
}
/* La entrada: se retira sola en 1,4 s, o antes si tocas, mueves o pulsas algo. */
(function entrada(){
  const el = document.getElementById('splash');
  if(!el) return;
  /* Una vez está bien; en cada visita es un peaje. */
  let visto = false;
  try { visto = !!sessionStorage.getItem('tablon.visto'); sessionStorage.setItem('tablon.visto','1'); } catch(e){}
  if(visto || window.matchMedia('(prefers-reduced-motion: reduce)').matches){ el.remove(); return; }
  let ido = false;
  const quitar = () => {
    if(ido) return; ido = true;
    el.classList.add('off');
    setTimeout(() => el.remove(), 650);
  };
  const tmr = setTimeout(quitar, 900);
  ['pointerdown','keydown','wheel','touchstart'].forEach(ev =>
    window.addEventListener(ev, () => { clearTimeout(tmr); quitar(); }, { once:true, passive:true }));
})();

(function init(){
  try {
    const x = localStorage.getItem('tablon.tema'); if(x) document.documentElement.setAttribute('data-theme', x);
    const l = localStorage.getItem('tablon.lang'); if(l === 'eu' || l === 'es') state.lang = l;
    const f = localStorage.getItem('tablon.form');
    if(f){ const g = JSON.parse(f); if(g && typeof g === 'object' && !Array.isArray(g)) state.form = g; }
  } catch(e){}
  leerURL();
  state.listo = true;
  render();
  window.addEventListener('resize', medirBarra);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(medirBarra);
  setTimeout(medirBarra, 300);
})();
</script>
