<title>Elorrioko Tabloia</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --gut:clamp(18px,2.6vw,44px);
    --ground:#ffffff; --ground-warm:#f6f3ed; --ink:#111111; --body:#444444;
    --mute:#8d8a84; --hair:#e7e3dc; --hair-soft:#f1ede6;
    --accent:#14453d; --accent-dim:#5c7a70; --accent-soft:#eaf0ed;
    --star:#14453d;
    --r:10px; --r-s:5px;
    --sh:0 1px 2px rgba(20,30,25,.05), 0 10px 30px -12px rgba(20,30,25,.18);
    --sh-hi:0 2px 6px rgba(20,30,25,.07), 0 18px 40px -14px rgba(20,30,25,.28);
    --scrim:linear-gradient(to top, rgba(10,16,13,.80) 0%, rgba(10,16,13,.40) 40%, rgba(10,16,13,.05) 80%),
      linear-gradient(to right, rgba(10,16,13,.52) 0%, rgba(10,16,13,.22) 46%, rgba(10,16,13,0) 72%);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:#141714; --ground-warm:#1c201c; --ink:#f2efe9; --body:#a8a49c;
      --mute:#7d7a72; --hair:#2c312c; --hair-soft:#232823;
      --accent:#8fc0b0; --accent-dim:#6d9184; --accent-soft:#1e2723; --star:#8fc0b0;
      --sh:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -12px rgba(0,0,0,.6);
      --sh-hi:0 2px 6px rgba(0,0,0,.5), 0 18px 40px -14px rgba(0,0,0,.75);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ground:#141714; --ground-warm:#1c201c; --ink:#f2efe9; --body:#a8a49c;
    --mute:#7d7a72; --hair:#2c312c; --hair-soft:#232823;
    --accent:#8fc0b0; --accent-dim:#6d9184; --accent-soft:#1e2723; --star:#8fc0b0;
    --sh:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -12px rgba(0,0,0,.6);
    --sh-hi:0 2px 6px rgba(0,0,0,.5), 0 18px 40px -14px rgba(0,0,0,.75);
    color-scheme: dark;
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  img { display:block; max-width:100%; }

  body { font-family:'Inter',-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;
    font-weight:300; background:var(--ground); color:var(--body); line-height:1.65;
    -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums; }

  .wrap { max-width:1800px; margin:0 auto; padding-inline:var(--gut); }
  .wrap.view { max-width:1560px; }
  .wrap.narrow { max-width:940px; }
  .stack { display:flex; flex-direction:column; }
  .g6{gap:6px} .g10{gap:10px} .g14{gap:14px} .g20{gap:20px} .g28{gap:28px} .g40{gap:40px} .g56{gap:56px} .g72{gap:72px}

  /* ---------- cabecera ---------- */
  .demo-strip { background:var(--accent); color:#f3f7f5; }
  :root[data-theme="dark"] .demo-strip, :root:not([data-theme="light"]) .demo-strip { color:#0f1512; }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .demo-strip { color:#f3f7f5; } }
  .demo-strip .wrap { padding-block:7px; font-size:11px; display:flex; gap:6px 14px; flex-wrap:wrap;
    align-items:baseline; justify-content:center; text-align:center; }
  .demo-strip b { font-weight:600; letter-spacing:.12em; text-transform:uppercase; font-size:9.5px; }

  .bar { position:sticky; top:0; z-index:40; background:var(--ground);
    border-bottom:1px solid var(--hair); }
  .bar .wrap { display:flex; align-items:center; gap:10px 34px; padding-block:15px; flex-wrap:wrap; }
  .mark { background:none; border:none; padding:0; cursor:pointer; display:flex; align-items:baseline; gap:9px; flex:0 0 auto; }
  .mark .w { font-size:19px; font-weight:500; letter-spacing:-.035em; color:var(--accent); }
  .mark .s { font-size:9.5px; font-weight:500; letter-spacing:.18em; text-transform:uppercase; color:var(--mute); }
  @media (max-width:430px) { .mark .s { display:none; } }

  /* secciones = ámbitos, como los departamentos de una tienda */
  .secs { display:flex; gap:30px; flex:1 1 0; min-width:0; overflow-x:auto; scrollbar-width:none; }
  .secs::-webkit-scrollbar { display:none; }
  .secs button { background:none; border:none; border-bottom:1.5px solid transparent; cursor:pointer;
    font:inherit; font-size:13.5px; font-weight:400; color:var(--body); padding:2px 0 3px;
    white-space:nowrap; transition:color .15s, border-color .15s; }
  .secs button:hover { color:var(--ink); }
  .secs button[aria-pressed="true"] { color:var(--ink); border-bottom-color:var(--ink); }

  .barright { display:flex; align-items:center; gap:10px 22px; flex:0 0 auto; margin-left:auto; }
  .ibtn { background:none; border:none; padding:0; cursor:pointer; color:var(--ink);
    display:grid; place-items:center; transition:opacity .15s; }
  .ibtn:hover { opacity:.6; }
  .ibtn svg { width:17px; height:17px; display:block; }
  .nav { display:flex; gap:22px; }
  .nav button { background:none; border:none; border-bottom:1.5px solid transparent; cursor:pointer;
    font:inherit; font-size:13.5px; font-weight:400; color:var(--body); padding:2px 0 3px;
    transition:color .15s, border-color .15s; }
  .nav button:hover { color:var(--ink); }
  .nav button[aria-current="page"] { color:var(--ink); border-bottom-color:var(--ink); }
  .nav button .c { color:var(--mute); }
  .langs { display:flex; align-items:baseline; gap:7px; }
  .langs .sl { color:var(--hair); font-size:11px; }
  .langs button { background:none; border:none; cursor:pointer; font:inherit; font-size:11.5px; font-weight:400;
    letter-spacing:.06em; color:var(--mute); padding:0; transition:color .15s; }
  .langs button:hover { color:var(--body); }
  .langs button[aria-pressed="true"] { color:var(--ink); font-weight:500; }
  .btn-pub { border:none; background:none; padding:0; font:inherit; font-size:13.5px; color:var(--accent);
    cursor:pointer; white-space:nowrap; transition:opacity .15s; }
  .btn-pub:hover { opacity:.7; }

  /* ---------- capa de búsqueda, se abre desde la lupa ---------- */
  .searchlayer { border-top:1px solid var(--hair); background:var(--ground); }
  .searchlayer .wrap { display:flex; align-items:center; gap:20px; padding-block:20px; }
  .qbox { position:relative; flex:1 1 auto; min-width:0; }
  .searchlayer input[type=text] { width:100%; border:none; background:none; padding:0; border-radius:0;
    font:inherit; font-size:clamp(19px,2.1vw,26px); font-weight:300; letter-spacing:-.022em; color:var(--ink); }
  .searchlayer input[type=text]:focus { outline:none; }
  .searchlayer input::placeholder { color:var(--mute); }
  .searchlayer .qbox .sugp { left:0; right:auto; width:min(620px,100%); top:calc(100% + 18px); }
  .tira { width:100%; height:210px; object-fit:cover; object-position:50% 46%; }

  /* ---------- barra de filtros, pegada bajo la navegación ---------- */
  .filterbar { position:sticky; top:var(--barh,58px); z-index:30; background:var(--ground);
    border-bottom:1px solid var(--hair); }
  .filterbar .wrap { display:flex; align-items:center; gap:6px 26px; padding-block:12px; flex-wrap:wrap; }
  .filterbar .flabel { font-size:9.5px; font-weight:500; letter-spacing:.16em; text-transform:uppercase;
    color:var(--mute); }
  .fgroup { display:flex; gap:24px; flex-wrap:wrap; align-items:center; }
  .fdrop { position:relative; }
  .fbtn { border:none; border-bottom:1.5px solid transparent; padding:2px 0 3px; background:none;
    font:inherit; font-size:13px; color:var(--body); cursor:pointer; white-space:nowrap;
    display:flex; gap:6px; align-items:center; transition:color .15s, border-color .15s; }
  .fbtn:hover { color:var(--ink); }
  .fbtn .ar { font-size:7px; opacity:.4; }
  .fbtn.act, .fdrop.on .fbtn { color:var(--ink); border-bottom-color:var(--ink); }
  .fbtn.act .ar, .fdrop.on .fbtn .ar { opacity:.65; }
  .qchip { display:flex; align-items:center; gap:8px; border:none; background:var(--accent-soft);
    color:var(--accent); border-radius:999px; padding:5px 12px; font:inherit; font-size:12.5px; cursor:pointer; }
  .qchip b { font-weight:500; }
  .qchip span { font-size:13px; opacity:.7; }
  .fpanel { position:absolute; top:calc(100% + 12px); left:0; z-index:50; background:var(--ground);
    border:1px solid var(--hair); border-radius:var(--r); box-shadow:var(--sh-hi); padding:7px;
    min-width:208px; display:none; max-height:330px; overflow-y:auto; }
  .fdrop.on .fpanel { display:block; }
  .fopt { display:block; width:100%; text-align:left; background:none; border:none; padding:9px 12px;
    border-radius:var(--r-s); font:inherit; font-size:13.5px; color:var(--body); cursor:pointer; }
  .fopt:hover { background:var(--ground-warm); color:var(--ink); }
  .fopt[aria-pressed="true"] { color:var(--accent); font-weight:500; }
  .fopt .n { float:right; color:var(--mute); font-size:11.5px; font-weight:300; }
  .fhead { font-size:9.5px; font-weight:500; letter-spacing:.13em; text-transform:uppercase; color:var(--mute);
    padding:11px 12px 5px; }
  .sugp { position:absolute; top:calc(100% + 10px); left:0; width:min(430px, 74vw); background:var(--ground);
    border:1px solid var(--hair); border-radius:var(--r); box-shadow:var(--sh-hi); padding:7px; z-index:60;
    display:none; max-height:350px; overflow-y:auto; }
  .qbox .sugp { width:min(380px, 80vw); }
  .sugp.on { display:block; }
  .sug { display:flex; gap:11px; align-items:center; width:100%; text-align:left; background:none; border:none;
    padding:8px 11px; border-radius:var(--r-s); cursor:pointer; font:inherit; }
  .sug:hover, .sug.sel { background:var(--ground-warm); }
  .sug img { width:40px; height:32px; object-fit:cover; border-radius:4px; flex:none; }
  .sug .dot { width:32px; height:32px; border-radius:6px; background:var(--accent-soft); color:var(--accent);
    display:grid; place-items:center; font-size:13px; flex:none; }
  .sug .t { font-size:13.5px; color:var(--ink); line-height:1.3; }
  .sug .s { font-size:11.5px; color:var(--mute); }
  .fmeta { margin-left:auto; display:flex; align-items:center; gap:16px; flex-wrap:wrap; font-size:12.5px; color:var(--mute); }
  .fmeta b { color:var(--ink); font-weight:500; }
  .sel { border:none; background:none; font:inherit; font-size:12.5px; color:var(--ink); cursor:pointer;
    border-bottom:1px solid var(--hair); padding:3px 0; border-radius:0; }
  .lnk { background:none; border:none; padding:0; cursor:pointer; font:inherit; font-size:12.5px;
    color:var(--accent); text-decoration:underline; text-underline-offset:3px; }

  /* ---------- categorías ---------- */
  .cats { display:flex; gap:10px; overflow-x:auto; scroll-snap-type:x proximity; padding-bottom:4px;
    scrollbar-width:none; }
  .cats::-webkit-scrollbar { display:none; }
  .cat-tile { position:relative; flex:1 0 138px; height:92px; scroll-snap-align:start;
    border-radius:var(--r); overflow:hidden; cursor:pointer;
    border:none; padding:0; background:var(--ground-warm); transition:box-shadow .18s; }
  .cat-tile img { width:100%; height:100%; object-fit:cover; transition:transform .5s ease; }
  .cat-tile:hover img { transform:scale(1.07); }
  .cat-tile .lbl { position:absolute; inset:auto 0 0 0; padding:24px 11px 8px; text-align:left;
    color:#fff; font-size:11.5px; font-weight:500; line-height:1.22; letter-spacing:-.005em;
    background:linear-gradient(to top, rgba(6,12,9,.92) 18%, rgba(6,12,9,.55) 58%, rgba(6,12,9,0)); }
  .cat-tile .lbl span { display:block; font-weight:300; font-size:10.5px; opacity:.9; margin-top:1px; }
  .cat-tile[aria-pressed="true"] { box-shadow:0 0 0 2px var(--accent); }

  /* ---------- tarjetas ---------- */
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(228px,1fr)); gap:28px 20px; }
  .card { display:flex; flex-direction:column; gap:9px; background:none; border:none; padding:0;
    font:inherit; color:inherit; text-align:left; cursor:pointer; }
  .ph { position:relative; aspect-ratio:3/2; border-radius:var(--r); overflow:hidden; background:var(--ground-warm); }
  .ph img { width:100%; height:100%; object-fit:cover; transition:transform .55s ease; }
  .card:hover .ph img { transform:scale(1.045); }
  .fav { position:absolute; top:10px; right:10px; width:32px; height:32px; border-radius:50%; border:none;
    background:rgba(255,255,255,.92); cursor:pointer; display:grid; place-items:center; transition:transform .15s; }
  .fav:hover { transform:scale(1.09); }
  .fav svg { width:15px; height:15px; fill:none; stroke:#333; stroke-width:1.8; }
  .fav[aria-pressed="true"] svg { fill:#b8443c; stroke:#b8443c; }
  .badge { position:absolute; top:10px; left:10px; background:rgba(255,255,255,.94); color:#14453d;
    font-size:9px; font-weight:600; letter-spacing:.11em; text-transform:uppercase; padding:5px 9px; border-radius:3px; }
  .badge.free { background:var(--accent); color:#fff; }
  .card-top { display:flex; justify-content:space-between; gap:12px; align-items:baseline; }
  .card-t { font-size:14px; font-weight:500; color:var(--ink); line-height:1.32; letter-spacing:-.008em;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .card-s { font-size:12.5px; color:var(--mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card-p { font-size:13.5px; color:var(--ink); }
  .card-p b { font-weight:500; }
  .card-p .u { color:var(--mute); font-weight:300; font-size:12px; }
  .stars { display:flex; align-items:center; gap:4px; font-size:12.5px; color:var(--ink); white-space:nowrap; }
  .stars i { font-style:normal; color:var(--star); }
  .stars em { font-style:normal; color:var(--mute); font-weight:300; }

  /* ---------- ficha ---------- */
  .gal { display:grid; grid-template-columns:2fr 1fr; grid-template-rows:1fr 1fr; gap:8px;
    border-radius:var(--r); overflow:hidden; aspect-ratio:2.9/1; max-height:440px; }
  .gal img { width:100%; height:100%; object-fit:cover; }
  .gal .g1 { grid-row:span 2; }
  .fcols { display:grid; grid-template-columns:minmax(0,1fr) 372px; gap:72px; align-items:start; }
  .sidebox { position:sticky; top:86px; border:1px solid var(--hair); border-radius:var(--r);
    padding:24px; box-shadow:var(--sh); display:flex; flex-direction:column; gap:18px; background:var(--ground); }
  .price-xl { font-size:26px; font-weight:400; color:var(--ink); letter-spacing:-.02em; }
  .price-xl .u { font-size:13px; color:var(--mute); font-weight:300; }
  .btn { border:1px solid var(--hair); background:none; color:var(--ink); cursor:pointer; font:inherit;
    font-size:13px; padding:12px 20px; border-radius:var(--r-s); transition:border-color .15s, background-color .15s; }
  .btn:hover { border-color:var(--ink); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:var(--ground); font-weight:500; }
  .btn.primary:hover { opacity:.88; }
  .btn.block { width:100%; text-align:center; }
  .btn.small { padding:8px 14px; font-size:12px; }
  .btn-row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chipx { border:1px solid var(--hair); border-radius:999px; padding:6px 13px; font-size:12.5px; color:var(--body); }
  .facts { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:20px 28px; }
  .fact { display:flex; flex-direction:column; gap:3px; }
  .fact .k { font-size:10px; font-weight:500; letter-spacing:.13em; text-transform:uppercase; color:var(--mute); }
  .fact .v { font-size:14px; color:var(--ink); line-height:1.45; }
  .sec-h { font-size:17px; font-weight:500; color:var(--ink); letter-spacing:-.015em; }
  .rule { height:1px; background:var(--hair); border:none; }
  .rev { display:grid; grid-template-columns:repeat(auto-fit,minmax(270px,1fr)); gap:26px 34px; }
  .rev .who { display:flex; align-items:center; gap:11px; margin-bottom:8px; }
  .av { width:36px; height:36px; border-radius:50%; background:var(--accent-soft); color:var(--accent);
    display:grid; place-items:center; font-size:12.5px; font-weight:500; flex:none; }
  .rev .nm { font-size:13.5px; color:var(--ink); font-weight:500; line-height:1.3; }
  .rev .dt { font-size:11.5px; color:var(--mute); }
  .rev p { font-size:13.5px; line-height:1.6; }
  .who-box { display:flex; gap:16px; align-items:center; }
  .av.big { width:52px; height:52px; font-size:17px; }

  /* ---------- agenda ---------- */
  .ag { display:grid; grid-template-columns:58px 1fr auto; gap:4px 20px; padding:16px 0;
    border-bottom:1px solid var(--hair-soft); align-items:center; }
  .ag .dt { font-size:12.5px; color:var(--mute); text-align:center; line-height:1.25; }
  .ag .dt b { display:block; font-size:19px; font-weight:400; color:var(--ink); }
  .ag.soon .dt b { color:var(--accent); }
  .ag .ti { font-size:14.5px; color:var(--ink); line-height:1.4; }
  .ag .pr { font-size:12.5px; color:var(--mute); }
  .ag .tag { font-size:10px; font-weight:500; letter-spacing:.11em; text-transform:uppercase; color:var(--mute);
    border:1px solid var(--hair); border-radius:999px; padding:5px 11px; white-space:nowrap; }
  .ag.soon .tag { color:var(--accent); border-color:var(--accent); }

  /* ---------- formularios ---------- */
  .field { display:flex; flex-direction:column; gap:7px; }
  .field > label { font-size:11px; font-weight:500; letter-spacing:.1em; text-transform:uppercase; color:var(--mute); }
  .field .hint { font-size:12px; color:var(--mute); line-height:1.5; }
  input[type=text], input[type=tel], input[type=email], input[type=number], textarea, select.inp {
    width:100%; background:var(--ground); border:1px solid var(--hair); border-radius:var(--r-s);
    font-family:inherit; font-size:14px; font-weight:300; color:var(--ink); padding:12px 14px;
    transition:border-color .15s; appearance:none; }
  textarea { resize:vertical; min-height:100px; line-height:1.6; }
  select.inp { cursor:pointer; }
  input:focus, textarea:focus, select:focus { outline:none; border-color:var(--accent); }
  ::placeholder { color:var(--mute); font-weight:300; opacity:1; }
  .field.err input, .field.err textarea, .field.err select { border-color:#b8443c; }
  input[type=checkbox], input[type=radio] { appearance:none; width:17px; height:17px; flex:none;
    border:1px solid var(--hair); background:var(--ground); cursor:pointer; border-radius:3px; transition:all .14s; }
  input[type=radio] { border-radius:50%; }
  input[type=checkbox]:checked, input[type=radio]:checked { background:var(--accent); border-color:var(--accent); }
  .opt { display:flex; align-items:center; gap:10px; font-size:13.5px; cursor:pointer; color:var(--body); }
  .opt:hover { color:var(--ink); }
  .opt-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(165px,1fr)); gap:13px 24px; }
  .pick { display:grid; grid-template-columns:17px 1fr; gap:13px; align-items:start; padding:15px;
    border:1px solid var(--hair); border-radius:var(--r-s); cursor:pointer; transition:border-color .15s; }
  .pick:hover { border-color:var(--mute); }
  .pick input { margin-top:2px; }
  .pick .pk-t { font-size:14px; color:var(--ink); font-weight:500; }
  .pick .pk-d { font-size:12.5px; color:var(--mute); line-height:1.5; }
  .file { border:1px dashed var(--hair); border-radius:var(--r-s); padding:16px 18px; display:flex;
    justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; }
  .file .fn { font-size:13.5px; color:var(--ink); font-weight:500; }
  .file .fd { font-size:12px; color:var(--mute); line-height:1.5; }
  .steps { display:flex; gap:8px; flex-wrap:wrap; }
  .step { flex:1 1 140px; padding:12px 14px; border-radius:var(--r-s); background:var(--ground-warm);
    display:flex; gap:9px; align-items:baseline; }
  .step .n { font-size:11px; font-weight:500; color:var(--mute); }
  .step .l { font-size:12.5px; color:var(--mute); line-height:1.35; }
  .step.on { background:var(--accent); } .step.on .n, .step.on .l { color:var(--ground); }
  .step.done .n, .step.done .l { color:var(--ink); }
  fieldset { border:none; display:flex; flex-direction:column; gap:12px; }

  /* ---------- varios ---------- */
  h1.pg { font-size:clamp(26px,3.6vw,38px); font-weight:300; letter-spacing:-.03em; line-height:1.14;
    color:var(--ink); text-wrap:balance; }
  h2.pg { font-size:21px; font-weight:500; color:var(--ink); letter-spacing:-.02em; }
  .eyebrow { font-size:10px; font-weight:500; letter-spacing:.19em; text-transform:uppercase; color:var(--accent); }
  .lead { font-size:16px; line-height:1.6; max-width:58ch; }
  p { font-size:14.5px; max-width:68ch; }
  .note { font-size:12.5px; color:var(--mute); line-height:1.55; max-width:72ch; }
  .back { background:none; border:none; padding:0; cursor:pointer; font:inherit; font-size:13px;
    color:var(--body); align-self:flex-start; }
  .back:hover { color:var(--accent); }

const norm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');

function precioLargo(f){ return f.precio === 0 ? t('gratuita') : f.precio + ' € ' + uni(f).l; }
function precioMes(f){ return Math.round(f.precio * UNIDADES[f.unidad].mes); }
function edadTxt(f){

function diasTxt(d){
  if(!d || !d.length) return '';

/* ---------- filtrado ---------- */
function filtrar(lista){
  const term = norm(state.q).trim().split(/\s+/).filter(Boolean);
  return lista.filter(f => {
    if(state.ambito){ const a = AMBITOS.find(x => x.id === state.ambito); if(a.cats.indexOf(f.cat) < 0) return false; }
    if(state.cat  && f.cat  !== state.cat)  return false;
    if(state.tipo && f.tipo !== state.tipo) return false;
    if(state.mod  && f.mod.indexOf(state.mod) < 0) return false;
    if(state.dia  && f.dias.indexOf(state.dia) < 0) return false;
    if(state.precioMax !== null){
      if(state.precioMax === 0){ if(f.precio !== 0) return false; }
      else if(precioMes(f) > state.precioMax) return false;
    }
    if(state.edad){
      const b = EDADES.find(e => e.id === state.edad);
      if(!(f.edad[0] <= b.max && f.edad[1] >= b.min)) return false;
    }
    if(term.length){
      const c = CATS.find(x => x.id === f.cat), ti = TIPOS.find(x => x.id === f.tipo);
      const heno = norm([f.titulo,f.proveedor,f.materias.join(' '),c.es,c.eu,ti.es,ti.eu,f.desc,f.lugar].join(' '));
      return term.every(x => heno.indexOf(x) >= 0);
    }
    return true;
  });
}
function ordenar(l){
  l = l.slice();
  if(state.orden === 'precio') return l.sort((a,b) => precioMes(a) - precioMes(b));
  if(state.orden === 'edad')   return l.sort((a,b) => a.edad[0] - b.edad[0]);
  if(state.orden === 'valor')  return l.sort((a,b) => (rating(b)||0) - (rating(a)||0));
  return l.sort((a,b) => {
    const d = CATS.findIndex(c=>c.id===a.cat) - CATS.findIndex(c=>c.id===b.cat);
    return d !== 0 ? d : a.proveedor.localeCompare(b.proveedor,'es');
  });
}
const hayFiltros = () => !!(state.q||state.ambito||state.cat||state.edad||state.tipo||state.mod||state.dia||state.precioMax!==null);
function contar(k, v){ const g = state[k]; state[k] = v; const n = filtrar(state.fichas).length; state[k] = g; return n; }

const nAct = n => n + ' ' + (n === 1 ? t('actividad') : t('actividades'));
function sugerencias(q){
  const n = norm(q).trim(); if(!n) return [];
  const out = [];
  CATS.forEach(c => { if(norm(c[state.lang]).indexOf(n) >= 0)
    out.push({ k:'cat', v:c.id, t:c[state.lang], s:nAct(contarCat(c.id)), img:CAT_IMG[c.id] }); });
  const mats = {};
  state.fichas.forEach(f => f.materias.forEach(m => {
    if(norm(m).indexOf(n) >= 0){ const key = m.toLowerCase(); mats[key] = (mats[key]||0) + 1; } }));
  Object.keys(mats).sort((a,b) => mats[b]-mats[a]).slice(0,4).forEach(m =>
    out.push({ k:'mat', v:m, t:cap(m), s:nAct(mats[m]) }));
  state.fichas.filter(f => norm(f.titulo + ' ' + f.proveedor).indexOf(n) >= 0).slice(0,5).forEach(f =>
    out.push({ k:'ficha', v:f.id, t:f.titulo, s:f.proveedor + ' · ' + (f.precio===0?t('gratis'):f.precio+' €'+uni(f).s), img:IMG[f.id] }));
  return out.slice(0,9);
}

function busqAbierta(){ const l = $('#searchlayer'); return !!l && !l.hidden; }
function abrirBusq(){
  const l = $('#searchlayer'); if(!l) return;
  l.hidden = false; medirBarra();
  const i = $('#q'); if(i){ i.focus(); i.select(); }
}
function cerrarBusq(){
  const l = $('#searchlayer'); if(!l || l.hidden) return;
  cerrarSug(); l.hidden = true; medirBarra();
}
function medirBarra(){
  const b = $('#bar'); if(!b) return;
  document.documentElement.style.setProperty('--barh', b.offsetHeight + 'px');
}
function render(scroll){
  const app = $('#app');
  const fb = $('#filterbar'); if(fb) fb.hidden = (state.view !== 'buscar');
  if(state.view === 'buscar'){ app.innerHTML = viewBuscar(); actualizar(); }
  else if(state.view === 'ficha')     app.innerHTML = viewFicha();
  else if(state.view === 'agenda')    app.innerHTML = viewAgenda();
  else if(state.view === 'guardados') app.innerHTML = viewGuardados();
  else if(state.view === 'publicar')  app.innerHTML = viewPublicar();
  else if(state.view === 'admin')     app.innerHTML = viewAdmin();
  pintarCromo();
  document.documentElement.lang = state.lang;
  medirBarra();
  if(scroll !== false) window.scrollTo(0,0);
}
function ir(v){
  if(state.view === 'buscar' && v !== 'buscar') state.scrollBuscar = window.scrollY;
  state.view = v; render();
  if(v === 'buscar' && state.scrollBuscar) window.scrollTo(0, state.scrollBuscar);
}
function altoBarras(){
  const b = $('#bar'), f = $('#filterbar');
  const hb = (b && getComputedStyle(b).position === 'sticky') ? b.offsetHeight : 0;
  return hb + (f && !f.hidden ? f.offsetHeight : 0) + 10;
}
function aResultados(){
  const a = $('#anchor-res'); if(!a) return;
  window.scrollTo({ top: Math.max(0, a.offsetTop - altoBarras()), behavior:'smooth' });
}

document.addEventListener('click', e => {
  if(!e.target.closest('.fdrop')) cerrarDrops();
  if(!e.target.closest('.qbox')) cerrarSug();
  if(busqAbierta() && !e.target.closest('.searchlayer') && !e.target.closest('#abrir-busq')) cerrarBusq();
  const b = e.target.closest('[data-act],[data-nav],[data-foot],[data-lang],#mark,#cta-pub');
  if(!b) return;
  if(b.id === 'mark'){ ir('buscar'); return; }
  if(b.id === 'cta-pub'){ ir('publicar'); return; }
  if(b.dataset.lang){ state.lang = b.dataset.lang;
    try { localStorage.setItem('tablon.lang', b.dataset.lang); } catch(err){}
    render(false); return; }
  if(b.dataset.nav){ ir(b.dataset.nav); return; }
  if(b.dataset.foot){
    if(b.dataset.foot === 'admin') ir('admin');
    if(b.dataset.foot === 'tema')  cambiarTema();
    return;
  }
  const act = b.dataset.act, v = b.dataset.v, id = +b.dataset.id;
  switch(act){
    case 'ficha':  state.fichaId = id; ir('ficha'); break;
    case 'volver': ir('buscar'); break;
    case 'ir':     ir(v); break;
    case 'irResultados': aResultados(); break;
    case 'abrirBusq': busqAbierta() ? cerrarBusq() : abrirBusq(); break;
    case 'cerrarBusq': cerrarBusq(); break;
    case 'limpiarQ': state.q = ''; syncQ(); cerrarSug(); actualizar(); break;
    case 'amb':
      state.ambito = v || null;
      if(state.cat){ const a = AMBITOS.find(x => x.id === state.ambito);
        if(!a || a.cats.indexOf(state.cat) < 0) state.cat = null; }
      if(state.view !== 'buscar'){ ir('buscar'); break; }
      actualizar(); break;
    case 'cat':
      state.cat = (state.cat === v) ? null : v;
      if(state.cat){ const a = AMBITOS.find(x => x.cats.indexOf(state.cat) >= 0); state.ambito = a ? a.id : null; }
      actualizar(); break;
    case 'edad': case 'tipo': case 'mod': case 'dia':
      state[act] = (state[act] === v) ? null : v; actualizar(); break;
    case 'drop': {
      const d = b.closest('.fdrop'), abierto = d.classList.contains('on');
      cerrarDrops();
      if(!abierto){ d.classList.add('on'); b.setAttribute('aria-expanded','true'); }
      break;
    }
    case 'setf': {
      const k = b.dataset.k, val = b.dataset.v;
      if(k === 'precioMax') state.precioMax = (val === '') ? null : +val;
      else state[k] = val || null;
      if(k === 'cat' && state.cat){ const a = AMBITOS.find(x => x.cats.indexOf(state.cat) >= 0); state.ambito = a ? a.id : null; }
      cerrarDrops(); actualizar(); break;
    }
    case 'sug': {
      const k = b.dataset.k, val = b.dataset.v;
      cerrarSug(); cerrarBusq();
      if(k === 'ficha'){ state.fichaId = +val; ir('ficha'); break; }
      if(k === 'cat'){ state.q = ''; state.cat = val;
        const a = AMBITOS.find(x => x.cats.indexOf(val) >= 0); state.ambito = a ? a.id : null; }
      if(k === 'mat') state.q = val;
      syncQ(); actualizar(); aResultados(); break;
    }
    case 'limpiar':
      state.q=''; state.ambito=null; state.cat=null; state.edad=null; state.tipo=null;
      state.mod=null; state.dia=null; state.precioMax=null;
      syncQ(); cerrarSug(); actualizar(); break;
    case 'fav': case 'guardar': {
      const i = state.guardados.indexOf(id);
      if(i >= 0){ state.guardados.splice(i,1); toast(t('tQuitado')); }
      else { state.guardados.push(id); toast(t('tGuardado')); }
      grabarGuardados();
      if(act === 'fav'){ b.setAttribute('aria-pressed', state.guardados.indexOf(id) >= 0); pintarCromo(); }
      else render(false);
      break;
    }
    case 'vaciar':    state.guardados = []; grabarGuardados(); render(false); break;
    case 'compartir': toast(t('tCompartir')); break;
    case 'contacto':  toast(t('tContacto')); break;
    case 'adjuntar':  toast(t('tAdjuntar')); break;
    case 'paso':      if(+v > state.paso && !validarPaso(state.paso)) break; state.paso = +v; render(); break;
    case 'tab':       state.adminTab = v; render(false); break;
    case 'salir':     state.admin = false; ir('buscar'); break;
    case 'aprobar': {
      const i = state.pendientes.findIndex(p => p.id === id); if(i < 0) break;
      const p = state.pendientes[i];
      if(!p.cert && p.edad[0] < 18){ toast(t('tCert')); break; }
      p.verif = true; state.fichas.unshift(p); state.pendientes.splice(i,1);
      toast(t('tPublicada')); render(false); break;
    }
    case 'pedirdatos': toast(t('tPedir')); break;
    case 'rechazar': {
      const i = state.pendientes.findIndex(p => p.id === id);
      if(i >= 0) state.pendientes.splice(i,1);
      toast(t('tRechazada')); render(false); break;
    }
    case 'ocultar': {
      const i = state.fichas.findIndex(f => f.id === id);
      if(i >= 0) state.fichas.splice(i,1);
      toast(t('tOculta')); render(false); break;
    }
  }
});
document.addEventListener('keydown', e => {
  const el = e.target;
  if(el.id === 'q'){
    const p = $('#sug1');
    const items = p ? Array.prototype.slice.call(p.querySelectorAll('.sug')) : [];
    if(e.key === 'Escape'){ cerrarSug(); cerrarBusq(); return; }
    if(!items.length || !p.classList.contains('on')){
      if(e.key === 'Enter'){ e.preventDefault(); cerrarBusq(); aResultados(); }
      return;
    }
    if(e.key === 'ArrowDown'){ e.preventDefault(); state.sugIdx = Math.min(state.sugIdx + 1, items.length - 1); }
    else if(e.key === 'ArrowUp'){ e.preventDefault(); state.sugIdx = Math.max(state.sugIdx - 1, -1); }
    else if(e.key === 'Enter'){
      e.preventDefault();
      if(state.sugIdx >= 0) items[state.sugIdx].click(); else { cerrarSug(); cerrarBusq(); aResultados(); }
      return;
    } else return;
    items.forEach((it,i) => it.classList.toggle('sel', i === state.sugIdx));
    if(state.sugIdx >= 0) items[state.sugIdx].scrollIntoView({ block:'nearest' });
    return;
  }
  if((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('card')){
    e.preventDefault(); state.fichaId = +e.target.dataset.id; ir('ficha');
  }
});
document.addEventListener('input', e => {
  const el = e.target;
  if(el.id === 'q'){
    state.q = el.value;
    if(state.view !== 'buscar' && state.q){ state.view = 'buscar'; render(false); }
    pintarSug('sug1'); actualizar(); return;
  }
  if(el.dataset.f){
    state.form[el.dataset.f] = (el.type === 'checkbox') ? el.checked : el.value;
    const c = el.closest('.field'); if(c) c.classList.remove('err');
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if(el.dataset.sel){ state[el.dataset.sel] = el.value || null; if(el.dataset.sel === 'orden') state.orden = el.value; actualizar(); return; }
  if(el.dataset.f) state.form[el.dataset.f] = (el.type === 'checkbox') ? el.checked : el.value;
  if(el.dataset.fm){
    const k = el.dataset.fm, arr = state.form[k] = state.form[k] || [];
    const i = arr.indexOf(el.value);
    if(el.checked && i < 0) arr.push(el.value);
    if(!el.checked && i >= 0) arr.splice(i,1);
  }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const id = e.target.id;
  if(id === 'form-pedir'){
    const inp = $('#pet'); if(!inp.value.trim()) return;
    state.peticiones.unshift({ id:Date.now(), texto:inp.value.trim(), veces:1, fecha: state.lang==='eu'?'Gaur':'Hoy' });
    inp.value = ''; toast(t('tAnotado'));
  }
  if(id === 'form-admin'){
    if($('#pass').value.trim().toLowerCase() === 'demo'){ state.admin = true; render(); }
    else toast(t('tPass'));
  }
  if(id === 'form-pub'){
    if(!validarPaso(4)) return;
    state.enviada = { titulo: state.form.titulo };
    const n = construirFicha(); if(n) state.pendientes.unshift(n);
    render();
  }
});
const CAMPOS_REQ = { 1:['tipo','nombre','dni','tel','email','direccion'], 2:['titulo','cat','desc','edadMin','edadMax'],
  3:['precio','lugar','horario'], 4:['ok1','ok2'] };
function validarPaso(paso){
  const claves = CAMPOS_REQ[paso], nombres = t('rQue' + (paso === 1 ? '' : paso)), falta = [];
  claves.forEach((k,i) => { const v = state.form[k];
    if(v === undefined || v === null || v === '' || v === false) falta.push([k, nombres[i]]); });
  if(!falta.length) return true;
  falta.forEach(([k]) => { const el = document.getElementById(k);
    if(el && el.closest('.field')) el.closest('.field').classList.add('err'); });
  toast(t('tFalta') + falta.slice(0,2).map(f => f[1]).join(t('y')) + (falta.length > 2 ? t('tFaltaMas') : '.'));
  return false;
}
function construirFicha(){
  const f = state.form;
  return { id:Date.now(), lang:f.flang || state.lang, titulo:f.titulo, proveedor:f.nombre,
    tipo:f.tipo || 'particular', cat:f.cat,
    materias:(f.materias||'').split(',').map(s => s.trim()).filter(Boolean),
    edad:[+f.edadMin||0, +f.edadMax||99], precio:+f.precio||0, unidad:f.unidad||'hora',
    mod:f.mod && f.mod.length ? f.mod : ['presencial'], lugar:f.lugar||'', dias:f.dias||[], horario:f.horario||'',
    desc:f.desc||'', exp:f.exp||'—', plazas:f.plazas||'—', verif:false, cert:false, tel:f.tel, email:f.email,
    dni:f.dni, enviado: state.lang==='eu' ? 'Oraintxe' : 'Hace un momento',
    aviso: state.lang==='eu'
      ? 'Formulariotik iritsi berri den fitxa. NANa eta ziurtagiriak egiaztatu behar dira argitaratu aurretik.'
      : 'Ficha recién enviada desde el formulario. Hay que comprobar el DNI y los certificados antes de publicarla.' };
}
function temaActual(){
  const x = document.documentElement.getAttribute('data-theme');
  return x || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
}
function pintarBotonTema(){
  const b = $('#foot-tema');
  if(b) b.textContent = temaActual() === 'dark' ? t('footClaro') : t('footOscuro');
}
function cambiarTema(){
  const n = temaActual() === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', n);
  try { localStorage.setItem('tablon.tema', n); } catch(e){}
  pintarBotonTema();
}
/* La entrada: se retira sola en 1,4 s, o antes si tocas, mueves o pulsas algo. */
(function entrada(){
  const el = document.getElementById('splash');
  if(!el) return;
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){ el.remove(); return; }
  let ido = false;
  const quitar = () => {
    if(ido) return; ido = true;
    el.classList.add('off');
    setTimeout(() => el.remove(), 750);
  };
  const tmr = setTimeout(quitar, 1400);
  ['pointerdown','keydown','wheel','touchstart'].forEach(ev =>
    window.addEventListener(ev, () => { clearTimeout(tmr); quitar(); }, { once:true, passive:true }));
})();

(function init(){
  try {
    const x = localStorage.getItem('tablon.tema'); if(x) document.documentElement.setAttribute('data-theme', x);
    const l = localStorage.getItem('tablon.lang'); if(l === 'eu' || l === 'es') state.lang = l;
  } catch(e){}
  render();
  window.addEventListener('resize', medirBarra);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(medirBarra);
  setTimeout(medirBarra, 300);
})();
</script>
